[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phraseloom"
version = "0.1.0"
description = "Clean Excel strings export, similarity grouping, and restore tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
]

[project.scripts]
phraseloom = "phraseloom.cli:main"

[project.gui-scripts]
phraseloom-gui = "phraseloom.gui:main"

[tool.setuptools.packages.find]
include = ["phraseloom*"]

[tool.setuptools.package-data]
phraseloom = ["*.toml"]
