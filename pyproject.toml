[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qatools"
version = "0.1.0"
description = "Excel localization QA tools and PhraseLoom strings workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pyahocorasick>=2.1,<3",
]

[project.scripts]
phraseloom = "phraseloom.cli:main"
toolshub = "toolshub_gui:main"

[project.gui-scripts]
phraseloom-gui = "phraseloom.gui:main"
toolshub-gui = "toolshub_gui:main"

[tool.setuptools]
py-modules = [
  "extract_terms_from_excel",
  "extract_terms_gui",
  "toolshub_gui",
]

[tool.setuptools.packages.find]
include = ["phraseloom*", "tools*"]

[tool.setuptools.package-data]
phraseloom = ["*.toml"]
